<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Orbit</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="/">Orbit</a>
    <h1>Log in</h1>
    <p>Welcome back to your local community.</p>

    <form id="auth-form" data-mode="login" method="POST" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required minlength="8" maxlength="128">

      <p class="form-message" id="form-message" role="alert">{{ error or "" }}</p>
      <button type="submit">Log In</button>
    </form>

    <p class="auth-switch">Need an account? <a href="/register">Register</a></p>
    <a class="back-link" href="/">Back to Orbit</a>
  </main>

  <script src="/static/auth.js"></script>
</body>
</html>
